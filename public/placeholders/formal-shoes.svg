<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#f8f9fa"/>
  <g transform="translate(200, 280)">
    <!-- Formal shoe shape -->
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    <path d="M -70,-15 Q -50,-50 0,-50 Q 50,-50 70,-15" 
          fill="#8b4513" 
          stroke="#654321" 
          stroke-width="2"/>
    <!-- Laces -->
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#654321" stroke-width="2"/>
    <line x1="-25" y1="-20" x2="25" y2="-20" stroke="#654321" stroke-width="2"/>
  </g>
  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6c757d">FORMAL SHOES</text>
</svg>
