<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#f8f9fa"/>
  <g transform="translate(200, 280)">
    <!-- Sneaker shape -->
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <path d="M -80,-20 Q -60,-60 0,-60 Q 60,-60 80,-20" 
          fill="#ffffff" 
          stroke="#dee2e6" 
          stroke-width="2"/>
    <!-- Nike swoosh style -->
    <path d="M -40,-30 Q 20,-40 40,-10" 
          fill="none" 
          stroke="#6c757d" 
          stroke-width="3"/>
  </g>
  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6c757d">SNEAKERS</text>
</svg>
