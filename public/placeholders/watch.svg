<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#f8f9fa"/>
  <g transform="translate(200, 250)">
    <!-- Watch circle -->
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#dee2e6" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#6c757d" stroke-width="1"/>
    <!-- Watch hands -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#2c3e50" stroke-width="3"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <!-- Watch band -->
    <rect x="-70" y="-15" width="20" height="30" fill="#6c757d" rx="3"/>
    <rect x="50" y="-15" width="20" height="30" fill="#6c757d" rx="3"/>
  </g>
  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6c757d">WATCH</text>
</svg>
